name: Sync spell icons

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sync-spell-icons.yml'
      - 'scripts/sync-spell-icons.mjs'
      - 'data/normalized/spell-data.json'
      - 'js/spell-ui-enhancements.js'
      - 'index.html'
  push:
    branches: [main, fix/spell-assets-local]
    paths:
      - '.github/workflows/sync-spell-icons.yml'
      - 'scripts/sync-spell-icons.mjs'
      - 'data/normalized/spell-data.json'

permissions:
  contents: write

concurrency:
  group: spell-icon-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download local spell icons
        run: npm run sync:spell-icons
      - name: Verify generated icon set
        shell: bash
        run: |
          COUNT=$(find assets/spells -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "Generated spell icons: ${COUNT}"
          test "${COUNT}" -gt 0
      - name: Upload generated spell icons
        uses: actions/upload-artifact@v4
        with:
          name: spell-icons
          path: assets/spells
          if-no-files-found: error
          retention-days: 3
      - name: Commit spell icons
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spells
          if git diff --cached --quiet; then
            echo "Spell icons are already current."
            exit 0
          fi
          git commit -m "assets: sync spell icons"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# Keep this workflow lightweight: it only materializes local spell images.
