name: Validate spell source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-spell-source.yml'
      - 'js/dofus-spell-normalizer.js'
      - 'scripts/sync-spells.mjs'
      - 'scripts/normalize-spells.mjs'
      - 'tests/dofus-spell-normalizer.test.mjs'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare current game version
        run: |
          mkdir -p data/raw
          curl -LfsS 'https://api.dofusdu.de/dofus3/v1/meta/version' -o data/raw/version.json
      - name: Sync and normalize spell source
        run: |
          npm run sync:spells
          npm run normalize:spells
      - name: Run spell tests
        run: node --test tests/dofus-spell-normalizer.test.mjs
      - name: Show spell coverage
        run: cat data/normalized/spell-coverage-report.md
