name: Inspect spell source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-spell-source.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download current Dofusdude release spell assets
        run: |
          VERSION=3.6.10.10
          BASE="https://github.com/dofusdude/dofus3-main/releases/download/${VERSION}"
          curl -LfsS "$BASE/spells.json" -o /tmp/spells.json
          curl -LfsS "$BASE/spell_levels.json" -o /tmp/spell_levels.json
          curl -LfsS "$BASE/breeds.json" -o /tmp/breeds.json
      - name: Print object/reference map samples
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          function describe(value, depth = 0) {
            if (depth > 3 || value == null || typeof value !== 'object') return value;
            if (Array.isArray(value)) return { kind: 'array', length: value.length, sample: value.length ? describe(value[0], depth + 1) : null };
            const keys = Object.keys(value);
            return {
              kind: 'object',
              keys: keys.slice(0, 20),
              sampleEntries: Object.fromEntries(keys.slice(0, 3).map((key) => [key, describe(value[key], depth + 1)]))
            };
          }
          for (const name of ['spells', 'spell_levels', 'breeds']) {
            const data = JSON.parse(fs.readFileSync(`/tmp/${name}.json`, 'utf8'));
            console.log(`=== ${name} objectsById ===`);
            console.log(JSON.stringify(describe(data.objectsById), null, 2).slice(0, 30000));
            console.log(`=== ${name} references ===`);
            console.log(JSON.stringify(describe(data.references), null, 2).slice(0, 30000));
          }
          NODE
