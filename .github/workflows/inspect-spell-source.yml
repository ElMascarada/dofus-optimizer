name: Inspect spell source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-spell-source.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download current Dofusdude release assets
        run: |
          VERSION=3.6.10.10
          BASE="https://github.com/dofusdude/dofus3-main/releases/download/${VERSION}"
          for FILE in spells spell_levels breeds effects fr; do
            curl -LfsS "$BASE/${FILE}.json" -o "/tmp/${FILE}.json"
          done
      - name: Map representative French labels and effect metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (name) => JSON.parse(fs.readFileSync(`/tmp/${name}.json`, 'utf8'));
          const refs = (name, className) => (read(name).references?.RefIds || [])
            .filter((entry) => !className || entry?.type?.class === className)
            .map((entry) => entry.data);
          const spells = refs('spells', 'SpellData');
          const levels = refs('spell_levels', 'SpellLevelData');
          const breeds = refs('breeds', 'BreedData');
          const effects = refs('effects');
          const breed = breeds.find((entry) => entry?.id === 1) || breeds.find((entry) => entry?.breedSpellsId?.Array?.length);
          const spell = spells.find((entry) => entry?.id === breed?.breedSpellsId?.Array?.[0]);
          const levelIds = spell?.spellLevels?.Array || [];
          const level = levels.filter((entry) => levelIds.includes(entry.id)).sort((a,b) => b.minPlayerLevel - a.minPlayerLevel)[0];
          const effectIds = [...new Set([...(level?.effects?.Array || []), ...(level?.criticalEffect?.Array || [])].map((entry) => entry.effectId))];

          const fr = read('fr');
          console.log('fr top-level', Object.keys(fr).slice(0, 20));
          console.log('fr sample', JSON.stringify(fr, null, 2).slice(0, 8000));
          function findTranslation(id) {
            const wanted = String(id);
            const seen = new Set();
            const queue = [{ path: '$', value: fr }];
            while (queue.length) {
              const { path, value } = queue.shift();
              if (!value || typeof value !== 'object' || seen.has(value)) continue;
              seen.add(value);
              if (!Array.isArray(value)) {
                if (Object.prototype.hasOwnProperty.call(value, wanted)) return { path: `${path}.${wanted}`, value: value[wanted] };
                if (Object.prototype.hasOwnProperty.call(value, Number(id))) return { path: `${path}.${wanted}`, value: value[Number(id)] };
              }
              for (const [key, child] of Object.entries(value)) {
                if (child && typeof child === 'object') queue.push({ path: `${path}.${key}`, value: child });
              }
            }
            return null;
          }
          console.log('translations', {
            breed: { id: breed?.shortNameId, match: findTranslation(breed?.shortNameId) },
            spell: { id: spell?.nameId, match: findTranslation(spell?.nameId) }
          });
          console.log('representative', JSON.stringify({
            breedId: breed?.id,
            spellId: spell?.id,
            levelId: level?.id,
            minPlayerLevel: level?.minPlayerLevel,
            apCost: level?.apCost,
            crit: level?.criticalHitProbability,
            effectIds,
            effectElements: [...new Set([...(level?.effects?.Array || []), ...(level?.criticalEffect?.Array || [])].map((entry) => entry.effectElement))]
          }, null, 2));
          console.log('effects top-level', Object.keys(read('effects')));
          console.log('effect matches', JSON.stringify(effects.filter((entry) => effectIds.includes(entry?.id)), null, 2).slice(0, 30000));
          NODE
