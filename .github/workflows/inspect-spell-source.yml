name: Inspect spell source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-spell-source.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download current Dofusdude release spell assets
        run: |
          VERSION=3.6.10.10
          BASE="https://github.com/dofusdude/dofus3-main/releases/download/${VERSION}"
          curl -LfsS "$BASE/spells.json" -o /tmp/spells.json
          curl -LfsS "$BASE/spell_levels.json" -o /tmp/spell_levels.json
          curl -LfsS "$BASE/breeds.json" -o /tmp/breeds.json
      - name: Print compact schema samples
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const name of ['spells', 'spell_levels', 'breeds']) {
            const data = JSON.parse(fs.readFileSync(`/tmp/${name}.json`, 'utf8'));
            console.log(`=== ${name} ===`);
            console.log('top-level keys', Object.keys(data));
            for (const [key, value] of Object.entries(data)) {
              const kind = Array.isArray(value) ? 'array' : value === null ? 'null' : typeof value;
              const length = Array.isArray(value) ? value.length : value && typeof value === 'object' ? Object.keys(value).length : null;
              console.log('field', key, 'kind', kind, 'length', length, 'value', length === null ? value : '');
            }
            const candidate = Object.values(data).find((value) => Array.isArray(value) && value.length)
              ?? Object.values(data).find((value) => value && typeof value === 'object' && Object.keys(value).length);
            const sample = Array.isArray(candidate) ? candidate[0] : candidate?.[Object.keys(candidate || {})[0]];
            console.log('sample', JSON.stringify(sample, null, 2).slice(0, 20000));
          }
          NODE
