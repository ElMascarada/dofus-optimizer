name: Inspect spell source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-spell-source.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect current Dofusdude release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=3.6.10.10
          gh release view "$VERSION" -R dofusdude/dofus3-main --json assets --jq '.assets[].name' | grep -Ei '(^|_)(fr|effect|spell|breed)|language|i18n' || true
      - name: Download current Dofusdude release spell assets
        run: |
          VERSION=3.6.10.10
          BASE="https://github.com/dofusdude/dofus3-main/releases/download/${VERSION}"
          curl -LfsS "$BASE/spells.json" -o /tmp/spells.json
          curl -LfsS "$BASE/spell_levels.json" -o /tmp/spell_levels.json
          curl -LfsS "$BASE/breeds.json" -o /tmp/breeds.json
      - name: Print representative spell and level data
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const refs = (name) => JSON.parse(fs.readFileSync(`/tmp/${name}.json`, 'utf8')).references.RefIds;
          const spells = refs('spells').filter((entry) => entry?.type?.class === 'SpellData').map((entry) => entry.data);
          const levels = refs('spell_levels').filter((entry) => entry?.type?.class === 'SpellLevelData').map((entry) => entry.data);
          const breeds = refs('breeds').filter((entry) => entry?.type?.class === 'BreedData').map((entry) => entry.data);
          console.log('counts', { spells: spells.length, levels: levels.length, breeds: breeds.length });
          const breed = breeds.find((entry) => entry?.breedSpellsId?.Array?.length) || breeds[0];
          console.log('breed', JSON.stringify({ id: breed?.id, shortNameId: breed?.shortNameId, spellIds: breed?.breedSpellsId?.Array?.slice(0, 8) }, null, 2));
          const wantedId = breed?.breedSpellsId?.Array?.[0];
          const spell = spells.find((entry) => entry?.id === wantedId) || spells.find((entry) => entry?.spellLevels?.Array?.length);
          console.log('spell', JSON.stringify(spell, null, 2).slice(0, 16000));
          const levelIds = spell?.spellLevels?.Array || [];
          console.log('spell levels', JSON.stringify(levels.filter((entry) => levelIds.includes(entry.id)), null, 2).slice(0, 40000));
          NODE
