name: T1 Recovery Slice 1 One-Shot

on:
  push:
    branches:
      - fix/t1-legal-build-trophy-coherence

permissions:
  contents: read

jobs:
  product-audit:
    if: github.event.head_commit.message == 'audit-run-t1-product-call'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diff check
        run: git diff --check cfc71263722ca84c958afc4a3885012e41b1c075..HEAD
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Product smoke
        run: npm run smoke:product
      - name: Exactly one production Worker call
        run: node scripts/t1-recovery-post-fix-audit.mjs
