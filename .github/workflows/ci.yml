name: Optimizer CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, steam-machine, dofus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chrome for V2 browser acceptance
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      - name: Inspect PM-variable effect definitions
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://github.com/dofusdude/dofus3-main/releases/download/3.6.10.10';
          async function json(name) {
            const r = await fetch(`${base}/${name}.json`);
            if (!r.ok) throw new Error(`${name}: ${r.status} ${r.statusText}`);
            return r.json();
          }
          const effects = await json('effects');
          const scripts = await json('spell_scripts');
          const wantedEffects = new Set([293, 1013, 1016, 186]);
          const wantedSpells = new Set([13145, 13358, 32460]);
          function collect(root, predicate) {
            const out = [];
            function walk(value, path = '$') {
              if (Array.isArray(value)) return value.forEach((entry, i) => walk(entry, `${path}[${i}]`));
              if (!value || typeof value !== 'object') return;
              if (predicate(value)) out.push({ path, value });
              for (const [key, entry] of Object.entries(value)) walk(entry, `${path}.${key}`);
            }
            walk(root);
            return out;
          }
          const effectRows = collect(effects, v => wantedEffects.has(Number(v.id ?? v.ankama_id ?? v.ankamaId)));
          const scriptRows = collect(scripts, v => {
            const text = JSON.stringify(v);
            return [...wantedSpells].some(id => text.includes(String(id)));
          });
          console.log('PM_EFFECT_DEFS_BEGIN');
          console.log(JSON.stringify(effectRows, null, 2));
          console.log('PM_EFFECT_DEFS_END');
          console.log('PM_SCRIPT_ROWS_BEGIN');
          console.log(JSON.stringify(scriptRows.slice(0, 80), null, 2));
          console.log('PM_SCRIPT_ROWS_END');
          NODE
      - name: Syntax check
        run: npm run check
      - name: Tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: V2 browser acceptance recipe
        shell: bash
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          npm run recipe:browser 2>&1 | tee recipe-v2-browser-output.txt
      - name: Product smoke
        shell: bash
        run: npm run smoke:product 2>&1 | tee product-smoke-output.txt
      - name: V2 migration baseline benchmark
        if: always()
        shell: bash
        run: npm run benchmark:v2 2>&1 | tee benchmark-v2-output.txt
      - name: Candidate search benchmark
        if: always()
        shell: bash
        run: npm run benchmark:search 2>&1 | tee benchmark-candidate-search-output.txt
      - name: Workshop recalculation benchmark
        if: always()
        shell: bash
        run: npm run benchmark:workshop 2>&1 | tee benchmark-workshop-output.txt
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-report
          path: |
            test-output.txt
            recipe-v2-browser-output.txt
            product-smoke-output.txt
            benchmark-v2-output.txt
            benchmark-candidate-search-output.txt
            benchmark-workshop-output.txt
          if-no-files-found: error
      - name: Fail when tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1
