name: Optimizer CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Synthetic six-Dofus diagnostic
        run: node scripts/debug-six-solver.mjs
      - name: Tests
        run: npm test
      - name: Search-space profile
        run: node scripts/profile-real-space.mjs
      - name: Hard-constraint Dofus frontier profile
        run: node scripts/profile-dofus-hard.mjs
        timeout-minutes: 1
      - name: Real snapshot solver smoke
        run: npm run smoke:real
        timeout-minutes: 1
