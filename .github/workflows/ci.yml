name: Optimizer CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, steam-machine, dofus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chrome for V2 browser acceptance
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      - name: Syntax check
        run: npm run check
      - name: Tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: V2 browser acceptance recipe
        shell: bash
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          npm run recipe:browser 2>&1 | tee recipe-v2-browser-output.txt
      - name: Product smoke
        if: always()
        shell: bash
        run: npm run smoke:product 2>&1 | tee product-smoke-output.txt
      - name: V2 migration baseline benchmark
        if: always()
        shell: bash
        run: npm run benchmark:v2 2>&1 | tee benchmark-v2-output.txt
      - name: Candidate search benchmark
        if: always()
        shell: bash
        run: npm run benchmark:search 2>&1 | tee benchmark-candidate-search-output.txt
      - name: Workshop recalculation benchmark
        if: always()
        shell: bash
        run: npm run benchmark:workshop 2>&1 | tee benchmark-workshop-output.txt
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-report
          path: |
            test-output.txt
            recipe-v2-browser-output.txt
            product-smoke-output.txt
            benchmark-v2-output.txt
            benchmark-candidate-search-output.txt
            benchmark-workshop-output.txt
          if-no-files-found: error
      - name: Fail when tests failed
        if: always() && steps.tests.outputs.status != '0'
        run: exit 1
