name: Sync Dofus data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main, feature/combat-turn-optimizer, fix/class-offensive-buffs]
    paths:
      - '.github/workflows/sync-dofus-data.yml'
      - 'js/data-certification.js'
      - 'js/dofus-passives.js'
      - 'js/dofus-source-rules.js'
      - 'js/dofusdude-normalizer.js'
      - 'js/dofus-spell-normalizer.js'
      - 'js/spell-combat-effects.js'
      - 'js/passives.js'
      - 'scripts/sync-dofusdude.mjs'
      - 'scripts/sync-spells.mjs'
      - 'scripts/normalize-dofusdude.mjs'
      - 'scripts/normalize-spells.mjs'
      - 'scripts/sync-spell-icons.mjs'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: dofus-data-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync and normalize Dofusdude
        run: npm run sync:normalize
      - name: Inspect raw variable spell source records
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('data/raw/spell_levels.json', 'utf8'));
          const wanted = new Set([41327, 41355, 41764, 85268]);
          function walk(value, path = '$') {
            if (Array.isArray(value)) {
              value.forEach((entry, index) => walk(entry, `${path}[${index}]`));
              return;
            }
            if (!value || typeof value !== 'object') return;
            const ids = [value.id, value.ankama_id, value.ankamaId].map(Number);
            if (ids.some((id) => wanted.has(id))) {
              console.log(`RAW SPELL LEVEL ${path}`);
              console.log(JSON.stringify(value, null, 2));
            }
            for (const [key, entry] of Object.entries(value)) walk(entry, `${path}.${key}`);
          }
          walk(raw);
          NODE
      - name: Run tests on normalized code
        run: |
          npm run check
          npm test
      - name: Show coverage summary
        run: |
          cat data/normalized/coverage-report.md
          echo
          cat data/normalized/spell-coverage-report.md
      - name: Commit changed snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/normalized/dofus-data.json \
            data/normalized/coverage-report.json \
            data/normalized/coverage-report.md \
            data/normalized/spell-data.json \
            data/normalized/spell-coverage-report.json \
            data/normalized/spell-coverage-report.md \
            assets/spells
          if git diff --cached --quiet; then
            echo "Dofus data and spell icons are already current."
            exit 0
          fi
          VERSION=$(node -e "const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync('./data/normalized/dofus-data.json','utf8')); console.log(d.gameVersion?.version || 'unknown')")
          git commit -m "data: sync Dofus ${VERSION}"
          git push
